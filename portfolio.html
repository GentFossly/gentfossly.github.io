<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Gent Fossly</title>
    <meta name="description" content="Portfolio of kinetic floral artworks and sculptural studies by Gent Fossly." />
    <style>
      :root {
        --bg: #f4efe9;
        --paper: #fffdfb;
        --ink: #1f1c1a;
        --muted: #615b55;
        --line: rgba(31, 28, 26, 0.12);
        --shadow: 0 20px 50px rgba(25, 20, 16, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
      }

      img {
        display: block;
        width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1180px, calc(100% - 2rem));
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 30;
        backdrop-filter: blur(12px);
        background: rgba(244, 239, 233, 0.78);
        border-bottom: 1px solid var(--line);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
      }

      .brand {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.98rem;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        color: var(--muted);
      }

      .nav-links a {
        position: relative;
      }

      .nav-links a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.2s ease;
      }

      .nav-links a:hover::after,
      .nav-links a:focus-visible::after {
        transform: scaleX(1);
      }

      .page-intro {
        padding: 4rem 0 2rem;
      }

      .page-intro h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(2.4rem, 5vw, 4.5rem);
        letter-spacing: -0.06em;
        line-height: 0.96;
        font-weight: 500;
      }

      .intro-copy {
        max-width: 700px;
        color: var(--muted);
        font-size: 1.08rem;
      }

      .gallery {
        padding: 1rem 0 4rem;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 1rem;
      }

      .card {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease, filter 0.35s ease;
      }

      .card:hover img,
      .card:focus-within img {
        transform: scale(1.03);
        filter: saturate(1.02);
      }

      .card--wide { grid-column: span 7; height: 540px; }
      .card--tall { grid-column: span 5; height: 540px; }
      .card--square { grid-column: span 4; height: 360px; }
      .card--landscape { grid-column: span 8; height: 360px; }

      .card--featured {
        grid-column: span 12;
        height: 580px;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 1rem 1.1rem 1.1rem;
        background: linear-gradient(to top, rgba(24, 22, 20, 0.72), rgba(24, 22, 20, 0));
        color: white;
      }

      .caption strong {
        display: block;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .caption span {
        font-size: 0.82rem;
        opacity: 0.8;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(16, 14, 12, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 100;
      }

      .lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-content {
        position: relative;
        max-width: min(1100px, 92vw);
        max-height: 90vh;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        overflow: hidden;
      }

      .lightbox-content img {
        max-width: min(1100px, 92vw);
        max-height: 90vh;
        object-fit: contain;
        display: block;
      }

      .lightbox-close {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        background: rgba(0,0,0,0.26);
        color: white;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
      }

      footer {
        padding: 1.5rem 0 3rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }

      @media (max-width: 900px) {
        .card--wide,
        .card--tall,
        .card--square,
        .card--landscape,
        .card--featured {
          grid-column: span 12;
          height: 420px;
        }
      }

      @media (max-width: 620px) {
        .nav {
          flex-direction: column;
          justify-content: center;
          gap: 0.75rem;
          padding: 0.9rem 0 1rem;
        }

        .page-intro {
          padding-top: 3rem;
        }

        .card--wide,
        .card--tall,
        .card--square,
        .card--landscape,
        .card--featured {
          height: 300px;
        }

        .footer-inner {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container nav">
        <a class="brand" href="index.html">Gent Fossly</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="portfolio.html">Portfolio</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-intro">
        <div class="container">
          <h1>Portfolio.</h1>
          <p class="intro-copy">
            Kinetic artworks rooted in flowers, motion, and transformation — exploring nature as an active, living force.
          </p>
        </div>
      </section>

      <section class="gallery">
        <div class="container">
          <div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="lightbox" class="lightbox" aria-modal="true" role="dialog" aria-label="Artwork preview">
      <div class="lightbox-content">
        <button class="lightbox-close" type="button" aria-label="Close image">×</button>
        <img id="lightboxImage" src="" alt="Expanded artwork preview" />
      </div>
    </div>

    <footer>
      <div class="container footer-inner">
        <div>Gent Fossly — artist and designer</div>
        <div>Based in the northwest of England</div>
      </div>
    </footer>

    <script>
      const repoOwner = 'GentFossly';
      const repoName = 'gentfossly.github.io';
      const imagesPath = 'images';
      const galleryGrid = document.getElementById('galleryGrid');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxClose = document.querySelector('.lightbox-close');

      const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg', '.bmp'];

      function isImageFile(name) {
        const lowerName = name.toLowerCase();
        return imageExtensions.some(ext => lowerName.endsWith(ext));
      }

      function createCard(item, index) {
        const article = document.createElement('article');
        article.className = 'card';

        const sizeClass = index % 6 === 0 ? 'card--featured' :
                          index % 3 === 0 ? 'card--wide' :
                          index % 2 === 0 ? 'card--landscape' :
                          'card--square';

        article.classList.add(sizeClass);
        article.tabIndex = 0;

        const img = document.createElement('img');
        img.src = item.download_url || item.html_url;
        img.alt = item.name;
        img.loading = 'lazy';

        const caption = document.createElement('div');
        caption.className = 'caption';

        const title = document.createElement('strong');
        title.textContent = item.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');

        const subtitle = document.createElement('span');
        subtitle.textContent = 'Artwork study';

        caption.appendChild(title);
        caption.appendChild(subtitle);
        article.appendChild(img);
        article.appendChild(caption);

        const openLightbox = () => {
          lightboxImage.src = item.download_url || item.html_url;
          lightboxImage.alt = item.name;
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
        };

        article.addEventListener('click', openLightbox);
        article.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openLightbox();
          }
        });

        return article;
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lightbox.classList.contains('open')) {
          closeLightbox();
        }
      });

      async function loadGalleryImages() {
        try {
          const response = await fetch(
            `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${imagesPath}`
          );

          if (!response.ok) {
            throw new Error('Unable to load gallery images.');
          }

          const files = await response.json();
          const imageFiles = files
            .filter(file => file.type === 'file' && isImageFile(file.name))
            .sort((a, b) => a.name.localeCompare(b.name));

          if (!imageFiles.length) {
            galleryGrid.innerHTML = '<p style="grid-column: 1 / -1; color: #615b55;">No images found in the /images folder yet.</p>';
            return;
          }

          galleryGrid.innerHTML = '';
          imageFiles.forEach((file, index) => {
            galleryGrid.appendChild(createCard(file, index));
          });
        } catch (error) {
          console.error(error);
          galleryGrid.innerHTML = `
            <p style="grid-column: 1 / -1; color: #615b55;">
              The gallery could not be loaded automatically right now. Please check the image folder.
            </p>
          `;
        }
      }

      loadGalleryImages();
    </script>
  </body>
</html>
