<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Gent Fossly | Artist & Designer</title>
    <meta
      name="description"
      content="Explore the work and practice of Gent Fossly through an interactive cube."
    />
    <script>
      if (sessionStorage.getItem('gentfossly-transition') === 'return') {
        document.documentElement.classList.add('is-returning');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="page-transitions.css?v=13" />
    <link rel="stylesheet" href="site-logo.css?v=2" />
    <style>
      :root {
        color-scheme: dark;
        --cube-size: min(72vw, 42vh, 300px);
        --cube-depth: calc(var(--cube-size) / 2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 280px;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: "Comfortaa", "Trebuchet MS", sans-serif;
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }

      body:active {
        cursor: grabbing;
      }

      .cube-scene {
        width: var(--cube-size);
        height: var(--cube-size);
        perspective: 1000px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
      }

      .cube-scene:active {
        cursor: grabbing;
      }

      .cube {
        position: relative;
        width: 100%;
        height: 100%;
        transform: rotateX(-18deg) rotateY(-18deg);
        transform-style: preserve-3d;
        will-change: transform;
      }

      .cube-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 2px solid rgba(255, 255, 255, 0.75);
        background: #050505;
        color: #fff;
        font-size: clamp(0.95rem, 3.8vw, 1.25rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
        text-decoration: none;
        backface-visibility: hidden;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease;
      }

      .cube-face::before {
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        content: "";
        pointer-events: none;
      }

      .cube-face:hover,
      .cube-face:focus-visible {
        background: #171717;
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      .front { transform: translateZ(var(--cube-depth)); }
      .back { transform: rotateY(180deg) translateZ(var(--cube-depth)); }
      .right { transform: rotateY(90deg) translateZ(var(--cube-depth)); }
      .left { transform: rotateY(-90deg) translateZ(var(--cube-depth)); }
      .top { transform: rotateX(90deg) translateZ(var(--cube-depth)); }
      .bottom { transform: rotateX(-90deg) translateZ(var(--cube-depth)); }

      .cube.is-transforming .cube-face {
        background: #fff;
        border-color: #fff;
        color: transparent;
        outline-color: transparent;
        pointer-events: none;
      }

      .cube.is-transforming .cube-face::before {
        border-color: transparent;
      }

      @media (prefers-reduced-motion: reduce) {
        .cube-face {
          transition-duration: 0.01ms;
        }

      }
    </style>
  </head>
  <body class="cube-home">
    <img class="site-logo" alt="Gent Fossly logo" hidden />
    <main>
      <div id="cubeScene" class="cube-scene" aria-label="Interactive navigation cube. Drag to turn it.">
        <div id="siteCube" class="cube">
          <a class="cube-face front" href="website%20pages/portfolio.html" data-page-transition>Portfolio</a>
          <a class="cube-face right" href="website%20pages/about.html" data-page-transition>About</a>
          <a class="cube-face back" href="website%20pages/contact.html" data-page-transition>Contact</a>
          <a class="cube-face left" href="website%20pages/process.html" data-page-transition>Process</a>
          <a class="cube-face top" href="website%20pages/exhibitions.html" data-page-transition>Exhibitions</a>
          <a class="cube-face bottom" href="website%20pages/poetry.html" data-page-transition>Poetry</a>
        </div>
      </div>
    </main>

    <script src="cube-interaction.js?v=7"></script>
    <script src="site-logo.js?v=2"></script>
    <script src="page-transitions.js?v=9"></script>
  </body>
</html>
