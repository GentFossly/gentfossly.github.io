<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Portfolio | Gent Fossly</title>
    <base href="../" />
    <meta name="description" content="Portfolio of kinetic floral artworks and sculptural studies by Gent Fossly." />
    <script>
      if (sessionStorage.getItem('gentfossly-transition') === 'enter') {
        document.documentElement.classList.add('is-entering');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="page-transitions.css?v=13" />
    <link rel="stylesheet" href="site-logo.css?v=2" />
    <style>
      :root {
        --bg: #000;
        --paper: #fff;
        --ink: #fff;
        --muted: #bdbdbd;
        --line: rgba(255, 255, 255, 0.18);
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Comfortaa", "Trebuchet MS", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
      }

      img {
        display: block;
        width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1320px, calc(100% - 3rem));
        margin: 0 auto;
      }

      header {
        padding: 1.5rem 0 0;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
      }

      .page-intro {
        padding: clamp(4rem, 9vw, 8rem) 0 2.5rem;
      }

      .page-intro h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.8rem, 8vw, 6.4rem);
        letter-spacing: -0.09em;
        line-height: 1.05;
        font-weight: 500;
      }

      .intro-copy {
        max-width: 650px;
        color: var(--muted);
        font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      }

      .gallery {
        padding: 1rem 0 5rem;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
        gap: clamp(0.65rem, 1.5vw, 1.2rem);
      }

      .card {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 28px;
        background: var(--paper);
        border: 1px solid rgba(244, 241, 232, 0.22);
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        transition: transform 0.5s cubic-bezier(0.2, 0.65, 0.3, 1), filter 0.35s ease;
      }

      .card:hover img,
      .card:focus-within img {
        transform: scale(1.03);
        filter: saturate(1.02);
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 1rem 1.1rem 1.1rem;
        background: linear-gradient(to top, rgba(24, 22, 20, 0.72), rgba(24, 22, 20, 0));
        color: white;
      }

      .caption strong {
        display: block;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .caption span {
        font-size: 0.82rem;
        opacity: 0.8;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(16, 14, 12, 0.82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 100;
      }

      .lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-content {
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: min(1100px, 92vw);
        max-height: 94vh;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        overflow: hidden;
      }

      .lightbox-stage {
        display: grid;
        place-items: center;
        min-width: min(80vw, 500px);
        min-height: 200px;
        max-height: 80vh;
      }

      .lightbox-stage img,
      .lightbox-stage video {
        max-width: min(1100px, 92vw);
        max-height: 80vh;
        object-fit: contain;
        display: block;
      }

      .lightbox-stage [hidden] {
        display: none;
      }

      .lightbox-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.65rem 0.85rem;
        color: white;
      }

      .lightbox-control {
        flex: 0 0 auto;
        min-width: 40px;
        min-height: 40px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        background: rgba(0,0,0,0.26);
        color: white;
        font: inherit;
        cursor: pointer;
      }

      .lightbox-control:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .lightbox-caption {
        text-align: center;
      }

      .lightbox-close {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        background: rgba(0,0,0,0.26);
        color: white;
        font-family: inherit;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
      }

      footer {
        padding: 1.5rem 0 3rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.78rem;
      }

      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }

      .portfolio-close {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 20;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font: inherit;
        font-size: 1.4rem;
        line-height: 1;
        text-decoration: none;
        transition: background-color 180ms ease, border-color 180ms ease;
      }

      .portfolio-close:hover,
      .portfolio-close:focus-visible {
        border-color: #fff;
        background: #222;
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .page-intro .eyebrow {
        display: inline-block;
        margin-bottom: 1.2rem;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .card:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      @media (max-width: 620px) {
        .page-intro {
          padding-top: 4rem;
        }

        .gallery-grid { grid-template-columns: 1fr 1fr; }

        .footer-inner {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <img class="site-logo" alt="Gent Fossly logo" hidden />
    <a class="portfolio-close" href="index.html" aria-label="Return to cube" data-cube-return>×</a>

    <main>
      <section class="page-intro">
        <div class="container">
          <span class="eyebrow">Selected works</span>
          <h1>Portfolio</h1>
          <p class="intro-copy">
            Kinetic artworks rooted in transformation — exploring nature as an active, living force.
          </p>
        </div>
      </section>

      <section class="gallery">
        <div class="container">
          <div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="lightbox" class="lightbox" aria-modal="true" aria-hidden="true" role="dialog" aria-label="Artwork gallery">
      <div class="lightbox-content">
        <button class="lightbox-close" type="button" aria-label="Close gallery">×</button>
        <div class="lightbox-stage">
          <img id="lightboxImage" alt="" hidden />
          <video id="lightboxVideo" controls playsinline hidden></video>
        </div>
        <div class="lightbox-toolbar">
          <button id="previousMedia" class="lightbox-control" type="button" aria-label="Previous item">←</button>
          <span id="lightboxCaption" class="lightbox-caption" aria-live="polite"></span>
          <button id="nextMedia" class="lightbox-control" type="button" aria-label="Next item">→</button>
        </div>
      </div>
    </div>

    <footer>
      <div class="container footer-inner">
        <div>Gent Fossly</div>
        <div>Based in the northwest of England</div>
      </div>
    </footer>

    <script src="site-logo.js?v=2"></script>
    <script>
      const galleryGrid = document.getElementById('galleryGrid');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxVideo = document.getElementById('lightboxVideo');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.querySelector('.lightbox-close');
      const previousMedia = document.getElementById('previousMedia');
      const nextMedia = document.getElementById('nextMedia');

      let activeProject = null;
      let activeMediaIndex = 0;
      let lastFocusedElement = null;
      let pointerPressedCard = null;

      document.addEventListener('pointerdown', (event) => {
        pointerPressedCard = event.isPrimary && event.button === 0 &&
          event.target instanceof Element ? event.target.closest('.card') : null;
      }, true);
      document.addEventListener('pointercancel', () => {
        pointerPressedCard = null;
      }, true);

      function createCard(project) {
        const article = document.createElement('article');
        article.className = 'card';

        const img = document.createElement('img');
        img.src = project.cover;
        img.alt = `${project.title} — featured artwork`;
        img.loading = 'lazy';

        const caption = document.createElement('div');
        caption.className = 'caption';

        const title = document.createElement('strong');
        title.textContent = project.title;

        const subtitle = document.createElement('span');
        subtitle.textContent = project.subtitle;
        caption.appendChild(title);
        if (project.subtitle) {
          caption.appendChild(subtitle);
        }
        article.appendChild(img);
        article.appendChild(caption);

        if (project.media.length > 0) {
          article.tabIndex = 0;
          article.setAttribute('role', 'button');
          article.setAttribute('aria-label', `View ${project.title} gallery`);
          article.addEventListener('click', () => {
            if (pointerPressedCard === article) {
              pointerPressedCard = null;
              openLightbox(project);
            }
          });
          article.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              pointerPressedCard = null;
              openLightbox(project);
            }
          });
        }

        return article;
      }

      function playVideoWhenVisible(media) {
        requestAnimationFrame(() => {
          if (!lightbox.classList.contains('open') ||
              lightboxVideo.hidden ||
              activeProject.media[activeMediaIndex] !== media) {
            return;
          }

          lightboxVideo.play().catch(error => {
            if (error.name !== 'AbortError') {
              console.error('Gallery video autoplay was blocked.', error);
            }
          });
        });
      }

      function renderActiveMedia() {
        const media = activeProject.media[activeMediaIndex];
        const isVideo = media.type === 'video';

        lightboxImage.hidden = isVideo;
        lightboxVideo.hidden = !isVideo;

        if (isVideo) {
          lightboxImage.removeAttribute('src');
          lightboxVideo.pause();
          lightboxVideo.src = media.src;
          lightboxVideo.muted = true;
          lightboxVideo.playsInline = true;
          lightboxVideo.load();
          playVideoWhenVisible(media);
        } else {
          lightboxVideo.pause();
          lightboxVideo.removeAttribute('src');
          lightboxVideo.load();
          lightboxImage.src = media.src;
          lightboxImage.alt = media.alt || activeProject.title;
        }

        lightboxCaption.textContent = `${activeProject.title} · ${activeMediaIndex + 1} of ${activeProject.media.length}`;
        previousMedia.disabled = activeMediaIndex === 0;
        nextMedia.disabled = activeMediaIndex === activeProject.media.length - 1;
      }

      function openLightbox(project) {
        activeProject = project;
        activeMediaIndex = 0;
        lastFocusedElement = document.activeElement;
        renderActiveMedia();
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        lightboxClose.focus();
      }

      function showMedia(index) {
        if (!activeProject || index < 0 || index >= activeProject.media.length) {
          return;
        }

        activeMediaIndex = index;
        renderActiveMedia();
      }

      function closeLightbox() {
        lightboxVideo.pause();
        lightboxVideo.removeAttribute('src');
        lightboxVideo.load();
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocusedElement instanceof HTMLElement) {
          lastFocusedElement.focus();
        }
      }

      lightboxClose.addEventListener('click', closeLightbox);
      previousMedia.addEventListener('click', () => showMedia(activeMediaIndex - 1));
      nextMedia.addEventListener('click', () => showMedia(activeMediaIndex + 1));
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (!lightbox.classList.contains('open')) {
          return;
        }

        if (event.key === 'Escape') {
          closeLightbox();
        } else if (event.key === 'ArrowLeft') {
          showMedia(activeMediaIndex - 1);
        } else if (event.key === 'ArrowRight') {
          showMedia(activeMediaIndex + 1);
        }
      });

      async function loadGallery() {
        try {
          const response = await fetch('projects.json');
          if (!response.ok) {
            throw new Error(`Unable to load projects.json (${response.status}).`);
          }

          const projects = await response.json();
          if (!Array.isArray(projects)) {
            throw new Error('The generated project manifest must be a JSON array.');
          }

          if (projects.length === 0) {
            galleryGrid.innerHTML = '<p style="grid-column: 1 / -1; color: #615b55;">No portfolio projects found. Add a project folder under /images.</p>';
            return;
          }

          projects.forEach((project, index) => {
            if (typeof project.title !== 'string' || typeof project.cover !== 'string' ||
                !Array.isArray(project.media)) {
              throw new Error(`Invalid project entry at position ${index + 1}.`);
            }

            galleryGrid.appendChild(createCard(project));
          });
        } catch (error) {
          console.error(error);
          galleryGrid.innerHTML = `
            <p style="grid-column: 1 / -1; color: #615b55;">
              The portfolio could not load its project list. Run the project generator and reload the page.
            </p>
          `;
        }
      }

      loadGallery();
    </script>
    <script src="page-transitions.js?v=9"></script>
  </body>
</html>
