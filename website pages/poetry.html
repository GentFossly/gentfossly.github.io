<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Poetry | Gent Fossly</title>
    <base href="../" />
    <meta name="description" content="Poetry and writing by Gent Fossly." />
    <script>
      if (sessionStorage.getItem('gentfossly-transition') === 'enter') {
        document.documentElement.classList.add('is-entering');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="section-page.css" />
    <link rel="stylesheet" href="page-transitions.css?v=13" />
    <link rel="stylesheet" href="site-logo.css?v=2" />
    <style>
      .poem-card {
        margin: 3rem 0 0;
        padding: clamp(1.25rem, 5vw, 2.5rem);
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
      }

      .poem-card h2 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1.3;
      }

      .poem-date {
        margin: 0.5rem 0 2rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .poem-text {
        margin: 0;
        color: var(--ink);
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

    </style>
  </head>
  <body>
    <img class="site-logo" alt="Gent Fossly logo" hidden />
    <main class="page">
      <a class="page-close" href="index.html" aria-label="Return to cube" data-cube-return>×</a>
      <h1>Poetry</h1>
      <div class="page-copy">
        <p>
          Poems primarily rhymed-up late at night.
          Different poem shown tomorrow.
        </p>
      </div>
      <article class="poem-card" aria-live="polite" aria-busy="true">
        <p id="poemLoading">Loading poem…</p>
        <div id="poemContent" hidden>
          <h2 id="poemTitle"></h2>
          <p class="poem-date"><time id="poemDate"></time></p>
          <pre id="poemText" class="poem-text"></pre>
        </div>
      </article>
    </main>
    <script src="poetry.js?v=2"></script>
    <script src="site-logo.js?v=2"></script>
    <script src="page-transitions.js?v=9"></script>
  </body>
</html>
